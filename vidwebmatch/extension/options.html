<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>vidwebmatch options</title>
  <style>
    body {
      font-family: Segoe UI, Arial, sans-serif;
      margin: 20px;
      max-width: 840px;
    }
    h1 {
      margin-top: 0;
    }
    .row {
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 4px;
    }
    input[type="number"], input[type="text"], textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
    }
    textarea {
      min-height: 100px;
      font-family: Consolas, "Courier New", monospace;
    }
    .checks label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 400;
    }
    button {
      padding: 8px 16px;
      cursor: pointer;
    }
    #status {
      margin-left: 12px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <h1>vidwebmatch options</h1>

  <div class="row">
    <label for="urlPatterns">URL patterns (one match pattern per line)</label>
    <textarea id="urlPatterns" placeholder="*://example.com/*"></textarea>
  </div>

  <div class="row checks">
    <label><input type="checkbox" id="scanLinks"> Scan links (href + link text)</label>
    <label><input type="checkbox" id="scanVisibleText"> Scan visible page text</label>
    <label><input type="checkbox" id="scanScopedTitles"> Scan scoped title text (no extension)</label>
  </div>

  <div class="row">
    <label for="titleScopeSelector">Scoped title selector (CSS)</label>
    <input type="text" id="titleScopeSelector" placeholder=".torrentNameInfo">
  </div>

  <div class="row">
    <label for="producersList">Producers (comma separated)</label>
    <input type="text" id="producersList" placeholder="PrivateSociety, AnotherProducer">
  </div>

  <div class="row">
    <label for="performersList">Performers (comma separated)</label>
    <input type="text" id="performersList" placeholder="Misty, AnotherPerformer">
  </div>

  <div class="row">
    <label for="dimStrings">Dim substrings — reduce text visibility of matching words (comma separated)</label>
    <input type="text" id="dimStrings" placeholder="XXX, XviD-iPT Team">
  </div>

  <div class="row">
    <label for="dimRows">Dim rows — reduce visibility of whole row when matched (comma separated)</label>
    <input type="text" id="dimRows" placeholder="UnwantedProducer, UnwantedPerformer">
  </div>

  <div class="row">
    <label for="batchSize">Batch size (native helper request)</label>
    <input type="number" id="batchSize" min="1" max="500">
  </div>

  <div class="row">
    <label for="maxCandidatesPerScan">Max candidates per scan</label>
    <input type="number" id="maxCandidatesPerScan" min="50" max="10000">
  </div>

  <div class="row">
    <label for="debounceMs">DOM change debounce (ms)</label>
    <input type="number" id="debounceMs" min="50" max="5000">
  </div>

  <div class="row">
    <button id="saveButton">Save</button>
    <span id="status"></span>
  </div>

  <script src="options.js"></script>
</body>
</html>
