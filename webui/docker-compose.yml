services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    working_dir: /app
    labels:
      homepage.enable: "true"
      homepage.group: "Media"
      homepage.name: "vidematcher webui"
      homepage.description: "Queue and monitor viddispatch runs"
      homepage.href: "http://localhost:6767/"
      homepage.icon: "mdi-movie-open-play"
    ports:
      - "6767:8000"
    env_file:
      - .env
    volumes:
      - ./:/app
      - ../:/workspace
      - M:/Server/LocalDev/VSCode/Scripts/vidematcher:/scripts
      - M:/Server/LocalDev/VSCode/Scripts/vidematcher/webui-defaults.json:/scripts/webui-defaults
      - M:/p:/p
      - Z:/:/z
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: rq worker --url ${REDIS_URL:-redis://redis:6379/0} vidematcher
    working_dir: /app
    env_file:
      - .env
    volumes:
      - ./:/app
      - ../:/workspace
      - M:/Server/LocalDev/VSCode/Scripts/vidematcher:/scripts
      - M:/Server/LocalDev/VSCode/Scripts/vidematcher/webui-defaults.json:/scripts/webui-defaults
      - M:/p:/p
      - Z:/:/z
    depends_on:
      - redis
    restart: unless-stopped
